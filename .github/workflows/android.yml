
name: Build Healthy Scheduled APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.json sw.js icon-192.png icon-512.png www/

      - name: Install dependencies
        run: npm install
      - name: Prepare Android launcher icon
        run: |
          npm install --no-save sharp @capacitor/assets
          mkdir -p resources
          cp logo-1024.png resources/icon.png

    
        
      - name: Generate Android project
        run: npx cap add android

      - name: Sync app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Healthy-Scheduled-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
